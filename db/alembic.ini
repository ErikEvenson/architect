[alembic]
script_location = db/alembic
# sqlalchemy.url is deliberately NOT set here (#312). It previously carried an
# inline password, and this repo is PUBLIC. Nothing in any deployment path read
# it: db/alembic/env.py sets the URL from $DATABASE_URL, and
# k8s/base/migration-job.yaml always supplies it from the secret. env.py now
# fails with an explicit message if DATABASE_URL is absent, which is better than
# silently connecting to a hardcoded default.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
